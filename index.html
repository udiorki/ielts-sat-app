<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IELTS & SAT Genius Simulator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="reading_data.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; user-select: none; overflow: hidden; overscroll-behavior-y: none; touch-action: none; }
    
    .q-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 28px; padding: 0 4px;
      border: 1px solid #cbd5e1; border-radius: 6px;
      font-size: 11px; font-weight: 700; background-color: #ffffff; color: #334155; cursor: pointer;
      transition: all 0.2s;
    }
    .q-badge.answered { background-color: #2563eb; color: #ffffff; border-color: #2563eb; }
    
    .split-container { display: flex; flex-direction: column; height: calc(100vh - 125px); }
    .split-pane { overflow-y: auto; padding: 14px; }
    .resizer-bar {
      height: 12px; background: #e2e8f0; cursor: row-resize;
      display: flex; align-items: center; justify-content: center;
      border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;
    }
    .resizer-bar::after { content: "•••"; color: #64748b; font-size: 10px; font-weight: bold; letter-spacing: 2px; }
  </style>
</head>
<body class="pb-16">

  <header class="bg-white border-b border-slate-200 px-4 py-2.5 sticky top-0 z-30 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-black flex items-center justify-center text-sm shadow">S</div>
      <div>
        <h1 class="font-extrabold text-slate-800 text-xs leading-tight">Student</h1>
        <p class="text-[10px] text-slate-500 font-medium">Cambridge Official Dataset</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-amber-50 border border-amber-200 text-amber-700 px-2 py-0.5 rounded-full text-xs font-black">
        <i class="fa-solid fa-fire text-amber-500"></i> <span>0</span>
      </div>
      <div class="flex items-center gap-1 bg-purple-50 border border-purple-200 text-purple-700 px-2 py-0.5 rounded-full text-xs font-black">
        <i class="fa-solid fa-bolt text-purple-500"></i> <span>150 XP</span>
      </div>
    </div>
  </header>

  <main id="view-home" class="p-4 space-y-4 max-w-md mx-auto">
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-bold uppercase">Estimated Band</p>
        <p class="text-base font-black text-slate-400">--</p>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-bold uppercase">Tests Done</p>
        <p class="text-base font-black text-slate-800">0</p>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-center shadow-sm">
        <p class="text-[10px] text-slate-400 font-bold uppercase">Accuracy</p>
        <p class="text-base font-black text-slate-400">0%</p>
      </div>
    </div>
    <h2 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider">Practice Modules</h2>
    <div class="grid grid-cols-2 gap-3">
      <div onclick="openBookSelection('reading')" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-400 transition-colors">
        <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm mb-2"><i class="fa-solid fa-book-reader"></i></div>
        <h4 class="font-bold text-slate-800 text-xs">Reading Practice</h4>
        <p class="text-[10px] text-slate-400">Books 1–21</p>
      </div>
    </div>
  </main>

  <section id="view-select-test" class="p-4 space-y-3 hidden max-w-md mx-auto">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-sm font-extrabold text-slate-800">Cambridge Books</h2>
        <p class="text-[11px] text-slate-500">Official Collection 1 — 21</p>
      </div>
      <button onclick="switchTab('view-home')" class="text-xs font-bold text-slate-500 bg-slate-200/60 px-2.5 py-1 rounded-lg">Back</button>
    </div>
    <div class="space-y-3" id="testSelectionList"></div>
  </section>

  <section id="view-test-runner" class="hidden flex flex-col h-screen overflow-hidden">
    <div class="bg-slate-900 text-white px-4 py-2 flex items-center justify-between shadow-md">
      <div>
        <h2 class="text-xs font-bold text-slate-200" id="testTitle">Cambridge IELTS 21 — Test 1</h2>
        <p class="text-[10px] text-emerald-400 font-semibold" id="testSubtitle">Academic Reading Test</p>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-mono font-bold px-2 py-0.5 rounded">
          <i class="fa-regular fa-clock mr-1"></i><span id="testTimer">59:59</span>
        </div>
        <button onclick="confirmExitTest()" class="bg-rose-600 text-white font-bold text-xs px-2.5 py-1 rounded">Exit</button>
      </div>
    </div>
    <div class="bg-slate-100 border-b border-slate-200 px-4 py-1.5 flex gap-2 overflow-x-auto" id="sectionNavTabs"></div>
    <div class="split-container" id="splitMainLayout">
      <div class="split-pane bg-white" id="topPane" style="height: 50%;">
        <div id="passageContent"></div>
      </div>
      <div class="resizer-bar" id="resizerBar"></div>
      <div class="split-pane bg-slate-50" id="bottomPane" style="height: 50%;">
        <div id="questionsContent"></div>
      </div>
    </div>
    <div class="bg-white border-t border-slate-200 px-4 py-2 sticky bottom-0 z-20 flex items-center justify-between gap-2 shadow-lg">
      <div class="flex items-center gap-1 overflow-x-auto py-1 max-w-[65%]" id="questionPalette"></div>
      <button onclick="switchTab('view-home')" class="bg-emerald-600 text-white font-extrabold text-xs px-3.5 py-2 rounded-lg shadow whitespace-nowrap">
        Submit Test
      </button>
    </div>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentSkill = 'reading';
    let userAnswers = {};
    let TEST = null;

    function openBookSelection(skill) {
      currentSkill = skill;
      switchTab('view-select-test');
      renderTestSelectionList();
    }

    function renderTestSelectionList() {
      const list = document.getElementById('testSelectionList');
      list.innerHTML = '';
      for (let book = 21; book >= 1; book--) {
        const item = document.createElement('div');
        item.className = 'bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-2';
        item.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 bg-blue-600 text-white rounded flex items-center justify-center font-black text-xs">C${book}</span>
              <h4 class="font-bold text-slate-800 text-xs">Cambridge IELTS ${book}</h4>
            </div>
            <span class="text-[10px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded uppercase">reading</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="launchCDTest(${book}, 1)" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs py-1.5 rounded font-bold hover:bg-blue-600 hover:text-white transition-colors">Test 1</button>
            <button onclick="launchCDTest(${book}, 2)" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs py-1.5 rounded font-bold hover:bg-blue-600 hover:text-white transition-colors">Test 2</button>
          </div>
        `;
        list.appendChild(item);
      }
    }

    function launchCDTest(book, testNumber) {
      userAnswers = {};
      switchTab('view-test-runner');
      
      const bookStr = String(book);
      const testStr = String(testNumber);

      // Жестко берем данные без лишних проверок
      TEST = window.CAMBRIDGE_DATA[bookStr][testStr];

      document.getElementById('testTitle').textContent = `Cambridge IELTS ${book} — Test ${testNumber}`;
      
      const tabs = document.getElementById('sectionNavTabs');
      if (TEST && TEST.passages) {
        tabs.innerHTML = TEST.passages.map((p, i) => 
          `<button id="pass-tab-${i+1}" onclick="switchReadingPassage(${i+1})" class="px-3 py-1 bg-white text-slate-700 border border-slate-200 rounded text-xs font-bold transition-colors">Passage ${i+1}</button>`
        ).join('');
      }
      renderPalette(40); 
      switchReadingPassage(1);
    }

    function switchReadingPassage(passageNum) {
      [1, 2, 3].forEach(p => {
        const btn = document.getElementById(`pass-tab-${p}`);
        if (btn) btn.className = p === passageNum 
          ? "px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold"
          : "px-3 py-1 bg-white text-slate-700 border border-slate-200 rounded text-xs font-bold transition-colors hover:bg-slate-50";
      });

      const passagePane = document.getElementById('passageContent');
      const questionsPane = document.getElementById('questionsContent');

      if (!TEST || !TEST.passages || !TEST.passages[passageNum - 1]) {
        passagePane.innerHTML = `<p class="p-4 text-xs">Данные пассажа загружаются или отсутствуют.</p>`;
        return;
      }

      const pData = TEST.passages[passageNum - 1];

      const textHtml = (pData.passage_text || "").split(/\n+/).map(para => {
        if (para.match(/^[A-G]\s/)) {
            return `<p class="mb-4 leading-relaxed"><strong class="text-base mr-2 text-slate-900">${para[0]}</strong> ${para.substring(2)}</p>`;
        }
        return `<p class="mb-4 leading-relaxed">${para}</p>`;
      }).join('');

      passagePane.innerHTML = `
        <div class="space-y-2 text-xs text-slate-800 p-3">
          <h3 class="font-extrabold text-slate-900 text-sm mb-4">Passage ${passageNum}: ${pData.title}</h3>
          ${textHtml}
        </div>
      `;

      let qHtml = `<div class="space-y-5 pb-8">`;
      pData.questions.forEach(q => {
        if (q.type === 'instruction') {
           qHtml += `<div class="bg-blue-50/90 p-3.5 rounded-xl border border-blue-200 sticky top-0 z-10 backdrop-blur-md shadow-sm">
             <h4 class="font-bold text-blue-900 text-xs leading-relaxed">${q.prompt}</h4>
           </div>`;
           return;
        }

        qHtml += `<div id="q-box-${q.id}" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">`;
        let promptText = q.prompt;

        if (q.type === 'grid') {
          qHtml += `<div class="text-[12px] font-medium text-slate-800 leading-relaxed mb-3">${promptText}</div>`;
          qHtml += `<div class="overflow-x-auto"><table class="w-full text-left border-collapse bg-slate-50/50 rounded-lg"><thead><tr><th class="p-2 border-b border-slate-200"></th>`;
          q.options.forEach(opt => {
            qHtml += `<th class="p-2 border-b border-slate-200 text-center text-slate-600 font-extrabold w-10">${opt}</th>`;
          });
          qHtml += `</tr></thead><tbody>`;
          q.sub_questions.forEach(subQ => {
            qHtml += `<tr><td class="p-3 border-b border-slate-200 text-[12px] font-medium text-slate-700 leading-snug"><span class='border border-slate-400 bg-white px-1.5 py-0.5 rounded text-[11px] font-black mr-2 shadow-sm'>${subQ.id}</span>${subQ.text}</td>`;
            q.options.forEach(opt => {
              let isChecked = userAnswers[subQ.id] === opt ? 'checked' : '';
              qHtml += `<td class="p-2 border-b border-slate-200 text-center bg-white"><input type="radio" name="q-${subQ.id}" value="${opt}" ${isChecked} onchange="markAnswered(${subQ.id}, this.value)" class="w-4 h-4 cursor-pointer accent-blue-600"></td>`;
            });
            qHtml += `</tr>`;
          });
          qHtml += `</tbody></table></div>`;
        } else if (q.type === 'fill_in') {
          let inputHtml = `<input type="text" oninput="markAnswered(${q.id}, this.value)" value="${userAnswers[q.id] || ''}" class="border-b-2 border-blue-500 bg-slate-50 px-2 py-0.5 text-blue-700 font-bold focus:outline-none focus:bg-blue-100 w-32 text-center mx-1 rounded-t transition-colors">`;
          let formattedPrompt = promptText.replace(/_+/g, inputHtml);
          qHtml += `<div class="text-[13px] font-medium text-slate-800 leading-relaxed">${formattedPrompt}</div>`;
        } else if (q.type === 'tfng' || q.type === 'mcq') {
          qHtml += `<div class="text-[13px] font-bold text-slate-800 leading-relaxed mb-2">${promptText}</div>`;
          qHtml += `<div class="space-y-2 mt-2">`;
          q.options.forEach(opt => {
             let isChecked = userAnswers[q.id] === opt ? 'checked' : '';
             let activeClass = isChecked ? 'bg-blue-50 border-blue-300' : 'border-slate-200 hover:bg-slate-50';
             qHtml += `
               <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer transition-colors ${activeClass}" onclick="updateRadioUI(this, ${q.id}, '${opt}')">
                 <input type="radio" name="q-${q.id}" value="${opt}" ${isChecked} class="hidden">
                 <div class="w-4 h-4 rounded-full border border-slate-400 flex items-center justify-center ${isChecked ? 'border-blue-600' : ''}">
                    <div class="w-2 h-2 rounded-full ${isChecked ? 'bg-blue-600' : 'bg-transparent'}"></div>
                 </div>
                 <span class="text-[13px] text-slate-700 font-medium">${opt}</span>
               </label>
             `;
          });
          qHtml += `</div>`;
        }
        qHtml += `</div>`;
      });
      qHtml += `</div>`;
      questionsPane.innerHTML = qHtml;
    }

    function updateRadioUI(labelElement, qId, value) {
        markAnswered(qId, value);
        const container = labelElement.parentElement;
        container.querySelectorAll('label').forEach(lbl => {
            lbl.className = 'flex items-center gap-3 p-3 border rounded-lg cursor-pointer transition-colors border-slate-200 hover:bg-slate-50';
            lbl.querySelector('.w-4').className = 'w-4 h-4 rounded-full border border-slate-400 flex items-center justify-center';
            lbl.querySelector('.w-2').className = 'w-2 h-2 rounded-full bg-transparent';
        });
        labelElement.className = 'flex items-center gap-3 p-3 border rounded-lg cursor-pointer transition-colors bg-blue-50 border-blue-300';
        labelElement.querySelector('.w-4').className = 'w-4 h-4 rounded-full border border-blue-600 flex items-center justify-center';
        labelElement.querySelector('.w-2').className = 'w-2 h-2 rounded-full bg-blue-600';
    }

    function renderPalette(total) {
      const palette = document.getElementById('questionPalette');
      if(!palette) return;
      palette.innerHTML = '';
      for (let i = 1; i <= total; i++) {
        const btn = document.createElement('div');
        btn.className = `q-badge ${userAnswers[i] ? 'answered' : ''}`;
        btn.id = `palette-q-${i}`;
        btn.innerText = i;
        btn.onclick = () => {
            if (i >= 1 && i <= 13) switchReadingPassage(1);
            else if (i >= 14 && i <= 26) switchReadingPassage(2);
            else if (i >= 27 && i <= 40) switchReadingPassage(3);
          setTimeout(() => document.getElementById(`q-box-${i}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        };
        palette.appendChild(btn);
      }
    }

    function markAnswered(qNum, value) {
      if (value && value.trim() !== '') {
        userAnswers[qNum] = value;
        document.getElementById(`palette-q-${qNum}`)?.classList.add('answered');
      } else {
        delete userAnswers[qNum];
        document.getElementById(`palette-q-${qNum}`)?.classList.remove('answered');
      }
    }

    function switchTab(tabId) {
      ['view-home', 'view-select-test', 'view-test-runner'].forEach(t => {
        document.getElementById(t)?.classList.add('hidden');
      });
      document.getElementById(tabId)?.classList.remove('hidden');
    }
  </script>
</body>
</html>
